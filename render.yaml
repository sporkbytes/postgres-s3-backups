services:
  - name: backup-db
    type: cron
    schedule: "0 11 * * *"
    region: oregon
    env: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      # Comma-separated region:bucket pairs. Put the region closest to your
      # database first (that target receives the streamed dump; others are
      # copied from it). Example:
      # us-west-2:my-db-backups-west,us-east-1:my-db-backups-east
      - key: S3_TARGETS
        sync: false
      # How many backup-*.sql.gz objects to keep per bucket (oldest pruned)
      - key: BACKUP_RETENTION_COUNT
        value: "7"
      # Looks like "AKIAXXXXXXXXXXXXXXXX"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Postgres version of your Postgres instance
      # For example, 16
      - key: POSTGRES_VERSION
        sync: false
      # Alpine base-OS version, see README
      # For example, 3.20
      - key: ALPINE_VERSION
        sync: false
